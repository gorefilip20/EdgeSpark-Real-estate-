<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property — EdgeSpark</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1C1917;background:#FAFAF9}
:root{--gold:#C9A24B;--navy:#0F1729;--bg:#FAFAF9;--surface:#FFF;--fg:#1C1917;--fg2:#57534E;--muted:#A8A29E;--border:#E7E5E4;--serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--success:#16A34A}
a{text-decoration:none;color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 0;background:rgba(250,249,247,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 1.5rem}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none}
.brand-mark{width:40px;height:40px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.1rem;color:var(--gold);font-weight:700}
.brand-name{font-weight:700;font-size:.95rem;color:var(--fg)}
.nav-links{display:flex;align-items:center;gap:1.5rem}
.nav-links a{font-size:.875rem;font-weight:500;color:var(--fg2);transition:color .2s}
.nav-links a:hover{color:var(--fg)}
.nav-cta{background:var(--navy)!important;color:#fff!important;padding:.6rem 1.4rem;font-weight:600;border-radius:8px}
.burger{display:none;background:none;border:none;cursor:pointer;padding:4px}
.burger span{display:block;width:22px;height:2px;background:var(--fg);margin:5px 0}

/* Breadcrumb */
.breadcrumb{padding:5.5rem 0 0;font-size:.875rem;color:var(--muted)}
.breadcrumb a{color:var(--fg2)}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{margin:0 .5rem}

/* Gallery */
.detail-main{padding:1rem 0 4rem}
.gallery{margin-bottom:2rem;border-radius:12px;overflow:hidden}
.gallery-main{width:100%;height:450px;background:linear-gradient(135deg,#1a2a40,#0f1e30);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-main video{width:100%;height:100%;object-fit:cover}
.gallery-main svg{stroke:rgba(255,255,255,.2)}
.gallery-count{position:absolute;bottom:1rem;right:1rem;background:rgba(0,0,0,.6);color:#fff;padding:.4rem .8rem;border-radius:6px;font-size:.8rem;font-weight:500}
.gallery-thumbs{display:flex;gap:.5rem;margin-top:.5rem;overflow-x:auto;padding-bottom:.5rem}
.gallery-thumb{width:80px;height:60px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;position:relative}
.gallery-thumb.active{border-color:var(--gold)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover}
.gallery-thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.video-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center}
.video-badge svg{width:12px;height:12px;fill:#fff;stroke:none}

/* Lightbox */
.lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex}
.lightbox-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;z-index:201;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.lightbox-content{max-width:90vw;max-height:80vh;display:flex;align-items:center;justify-content:center}
.lightbox-content img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}
.lightbox-content video{max-width:100%;max-height:80vh;border-radius:8px}
.lightbox-nav{display:flex;gap:1rem;margin-top:1rem}
.lightbox-nav button{padding:.5rem 1.25rem;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:.875rem}
.lightbox-nav button:hover{background:rgba(255,255,255,.25)}
.lightbox-counter{color:rgba(255,255,255,.5);font-size:.875rem;margin-top:.5rem}

/* Detail Grid */
.detail-grid{display:grid;grid-template-columns:1fr 380px;gap:2rem;align-items:start}
.detail-info{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem}
.detail-info h1{font-family:var(--serif);font-size:1.75rem;margin-bottom:.5rem}
.detail-location{display:flex;align-items:center;gap:.4rem;font-size:.875rem;color:var(--muted);margin-bottom:1.5rem}
.detail-specs{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;padding:1.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.spec-item label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem}
.spec-item span{font-size:1rem;font-weight:600;color:var(--fg)}
.detail-price{font-family:var(--serif);font-size:2rem;color:var(--fg);font-variant-numeric:tabular-nums;margin-bottom:1.5rem}
.detail-price small{font-family:var(--sans);font-size:.875rem;color:var(--muted);font-weight:400;margin-left:.5rem}
.detail-price.struck{text-decoration:line-through;color:var(--muted);font-size:1.25rem}
.sale-price{font-size:1rem;color:var(--success);font-weight:600;margin-bottom:1.5rem}
.detail-desc{font-size:.9rem;color:var(--fg2);line-height:1.7;margin-bottom:1.5rem}
.badge{display:inline-block;padding:.35rem .75rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;margin-bottom:1rem}
.badge-available{background:var(--gold);color:#fff}
.badge-sold{background:#9CA3AF;color:#fff}

/* Protection List */
.protection-list{list-style:none;counter-reset:protection}
.protection-list li{counter-increment:protection;display:flex;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--border);font-size:.875rem;color:var(--fg2)}
.protection-list li:last-child{border-bottom:none}
.protection-list li::before{content:counter(protection);font-family:var(--serif);font-size:1rem;color:var(--gold);width:1.5rem;flex-shrink:0}

/* Sidebar Cards */
.sidebar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
.sidebar-card h2{font-family:var(--serif);font-size:1.25rem;margin-bottom:1rem}
.deal-row{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--border);font-size:.875rem}
.deal-row:last-child{border-bottom:none}
.deal-row.highlight{background:var(--bg);margin:0 -.75rem;padding:.6rem .75rem;border-radius:6px}
.deal-row.profit{background:#f0f7ef;margin:0 -.75rem;padding:.6rem .75rem;border-radius:6px}
.deal-row.profit span:last-child{color:var(--success);font-weight:600}

/* CTA */
.cta-btn{display:block;width:100%;padding:1rem;background:var(--gold);color:#061222;font-weight:700;font-size:1rem;border:none;border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;margin-top:1rem}
.cta-btn:hover{background:#D4B96A;transform:translateY(-1px)}
.cta-secondary{display:block;width:100%;padding:.75rem;background:none;color:var(--fg);font-weight:600;font-size:.875rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;margin-top:.5rem}
.cta-secondary:hover{border-color:var(--gold);color:var(--gold)}
.contact-info{margin-top:1rem;padding:1rem;background:var(--bg);border-radius:8px;font-size:.875rem;color:var(--fg2)}
.contact-info a{color:var(--gold);font-weight:600}

/* Interest Form */
.interest-form{display:none;margin-top:1rem}
.interest-form.open{display:block}
.interest-form textarea{width:100%;padding:.75rem 1rem;font-size:.875rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:var(--sans);resize:vertical;min-height:80px}
.interest-form textarea:focus{outline:none;border-color:var(--gold)}
.interest-form select{width:100%;padding:.5rem .75rem;font-size:.875rem;border:1px solid var(--border);border-radius:8px;margin-top:.5rem;font-family:var(--sans)}
.interest-form .submit-interest{margin-top:.75rem;width:100%;padding:.75rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.875rem}
.interest-form .submit-interest:hover{opacity:.9}

/* Related */
.related-section{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}
.related-section h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:1.5rem}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem}
.related-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.related-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.related-card .rc-img{height:180px;background:linear-gradient(135deg,#1a2a40,#0f1e30);display:flex;align-items:center;justify-content:center;overflow:hidden}
.related-card .rc-img img{width:100%;height:100%;object-fit:cover}
.related-card .rc-body{padding:1rem}
.related-card .rc-title{font-family:var(--serif);font-size:1rem;margin-bottom:.25rem}
.related-card .rc-loc{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.related-card .rc-price{font-family:var(--serif);font-size:1.1rem;color:var(--fg)}

/* Map */
.map-container{background:linear-gradient(135deg,#1a2a40,#0f1e30);height:300px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-top:2rem}
.map-placeholder{color:rgba(255,255,255,.3);text-align:center}

@media(max-width:768px){
  .detail-grid{grid-template-columns:1fr}
  .gallery-main{height:280px}
  .nav-links{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--navy);flex-direction:column;justify-content:center;gap:2.5rem;z-index:99}
  .nav-links.open{display:flex}
  .nav-links a{font-size:1.25rem;color:rgba(255,255,255,.8)}
  .nav-cta{background:var(--gold)!important;color:var(--navy)!important}
  .burger{display:block;z-index:101}
  .related-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 40 40" width="40" height="40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="6" fill="#0F1729"/><path d="M20 8L10 19h20z" fill="#C9A24B"/><rect x="14" y="21" width="12" height="11" rx="1" fill="#C9A24B"/><rect x="17.5" y="24" width="5" height="8" rx=".5" fill="#0F1729"/></svg></span><span class="brand-text"><span class="brand-name">EdgeSpark</span></span></a>
    <nav class="nav-links" id="navLinks">
      <a href="/#opportunity">Opportunity</a>
      <a href="/api/public/page/properties">Properties</a>
      <a href="/#learn">Learn</a>
      <a href="/api/public/page/calculator">Calculator</a>
      <a href="/api/public/page/partner">Partner</a>
      <a href="/api/public/page/login" class="nav-cta">Login</a>
    </nav>
    <button class="burger" id="burger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
<div class="container">
  <div class="breadcrumb">
    <a href="/">Home</a><span>/</span>
    <a href="/api/public/page/properties">Properties</a><span>/</span>
    <span id="breadcrumbTitle">Loading...</span>
  </div>
</div>
<div class="detail-main">
<div class="container">
  <div id="propertyContent"><p style="color:#A8A29E">Loading property...</p></div>
</div>
</div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-content" id="lightboxContent"></div>
  <div class="lightbox-nav">
    <button onclick="lightboxNav(-1)">&larr; Previous</button>
    <button onclick="lightboxNav(1)">Next &rarr;</button>
  </div>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<footer style="background:var(--navy);color:rgba(255,255,255,.5);padding:3rem 0;text-align:center;font-size:.875rem">
  <div class="container">
    <p>&copy; 2026 Evarestus Company Ltd. All rights reserved. · EdgeSpark</p>
  </div>
</footer>

<script>
document.getElementById('burger')?.addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('open'));
function formatNgn(n){return new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(n);}

let mediaItems=[];
let lightboxIndex=0;
const slug=window.location.pathname.split('/').pop();

function openLightbox(idx){
  lightboxIndex=idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
  const vid=document.querySelector('#lightboxContent video');
  if(vid)vid.pause();
}

function lightboxNav(dir){
  const vid=document.querySelector('#lightboxContent video');
  if(vid)vid.pause();
  lightboxIndex=(lightboxIndex+dir+mediaItems.length)%mediaItems.length;
  renderLightbox();
}

function renderLightbox(){
  const item=mediaItems[lightboxIndex];
  const el=document.getElementById('lightboxContent');
  if(item.type==='video'){
    el.innerHTML='<video controls autoplay style="max-width:90vw;max-height:80vh;border-radius:8px"><source src="'+item.url+'" type="'+(item.mime||'video/mp4')+'"></video>';
  }else{
    el.innerHTML='<img src="'+item.url+'" alt="Property image">';
  }
  document.getElementById('lightboxCounter').textContent=(lightboxIndex+1)+' / '+mediaItems.length;
}

document.getElementById('lightbox').addEventListener('click',function(e){
  if(e.target===this)closeLightbox();
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')lightboxNav(-1);
  if(e.key==='ArrowRight')lightboxNav(1);
});

async function loadProperty(){
  try{
    const r=await fetch('/api/public/properties/'+slug);
    const d=await r.json();
    if(!d.ok){document.getElementById('propertyContent').innerHTML='<p style="color:#DC2626">Property not found.</p>';return;}
    const p=d.property;
    document.title=p.title+' — EdgeSpark';
    document.getElementById('breadcrumbTitle').textContent=p.title;

    const isSold=p.status==='sold';

    // Build media items for gallery
    mediaItems=[];
    if(p.hero_image)mediaItems.push({url:p.hero_image,type:'image'});
    if(p.gallery_images){
      try{
        const gi=JSON.parse(p.gallery_images);
        if(Array.isArray(gi))gi.forEach(url=>mediaItems.push({url,type:'image'}));
      }catch{}
    }

    // Load additional media from API
    try{
      const mr=await fetch('/api/public/properties/'+p.id+'/media');
      const md=await mr.json();
      if(md.ok&&md.items){
        md.items.forEach(m=>{
          const existing=mediaItems.find(mi=>mi.url===m.url);
          if(!existing)mediaItems.push({url:m.url,type:m.media_type||'image',mime:m.mime_type});
        });
      }
    }catch{}

    const mainMedia=mediaItems.length>0?
      (mediaItems[0].type==='video'?
        '<video autoplay muted loop playsinline><source src="'+mediaItems[0].url+'" type="'+(mediaItems[0].mime||'video/mp4')+'"></video>':
        '<img src="'+mediaItems[0].url+'" alt="'+p.title+'">'
      ):
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>';

    const thumbsHtml=mediaItems.length>1?mediaItems.map((m,i)=>{
      if(m.type==='video'){
        return '<div class="gallery-thumb'+(i===0?' active':'')+'" onclick="switchMedia('+i+')"><video muted><source src="'+m.url+'"></video><div class="video-badge"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>';
      }
      return '<div class="gallery-thumb'+(i===0?' active':'')+'" onclick="switchMedia('+i+')"><img src="'+m.url+'" alt="Thumbnail"></div>';
    }).join(''):'';

    const priceHtml=isSold?
      '<div class="detail-price struck">'+formatNgn(p.price_ngn)+'</div>'+(p.price_note?'<div class="sale-price">Sold for '+formatNgn(parseInt(p.price_note))+'</div>':'<div class="sale-price">Sold</div>'):
      '<div class="detail-price">'+formatNgn(p.price_ngn)+' <small>~ $'+Math.round(p.price_ngn/1600).toLocaleString()+' USD</small></div>';

    const interestCTA=isSold?'':
      '<button class="cta-btn" onclick="toggleInterestForm()">Express Interest</button>'+
      '<button class="cta-secondary" onclick="window.location=\'/api/public/page/calculator\'">Calculate Returns</button>'+
      '<div class="interest-form" id="interestForm">'+
        '<textarea id="interestMsg" placeholder="Tell us about your investment goals..."></textarea>'+
        '<select id="interestAmount"><option value="">Investment range</option><option value="$5,000-$10,000">$5,000 - $10,000</option><option value="$10,000-$50,000">$10,000 - $50,000</option><option value="$50,000-$100,000">$50,000 - $100,000</option><option value="$100,000+">$100,000+</option></select>'+
        '<button class="submit-interest" onclick="submitInterest(\''+p.id+'\')">Submit Interest</button>'+
      '</div>';

    document.getElementById('propertyContent').innerHTML=
      '<div class="gallery"><div class="gallery-main" id="galleryMain" onclick="openLightbox(0)">'+mainMedia+
      (mediaItems.length>1?'<span class="gallery-count">'+mediaItems.length+' photos</span>':'')+
      '</div>'+
      (thumbsHtml?'<div class="gallery-thumbs" id="galleryThumbs">'+thumbsHtml+'</div>':'')+
      '</div>'+
      '<div class="detail-grid"><div class="detail-info">'+
        '<span class="badge '+(isSold?'badge-sold':'badge-available')+'">'+(isSold?'Sold':'Available')+'</span>'+
        '<h1>'+p.title+'</h1>'+
        '<div class="detail-location"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+p.address+', '+p.city+', '+p.state+'</div>'+
        priceHtml+
        '<div class="detail-specs">'+
          '<div class="spec-item"><label>Bedrooms</label><span>'+(p.bedrooms||'-')+'</span></div>'+
          '<div class="spec-item"><label>Bathrooms</label><span>'+(p.bathrooms||'-')+'</span></div>'+
          '<div class="spec-item"><label>Plot Size</label><span>'+(p.plot_size_sqm?p.plot_size_sqm+' sqm':'-')+'</span></div>'+
          '<div class="spec-item"><label>Type</label><span>'+(p.property_type||'-')+'</span></div>'+
        '</div>'+
        (p.description?'<div class="detail-desc">'+p.description+'</div>':'')+
        '<h3 style="font-size:1rem;font-weight:700;margin:1.5rem 0 1rem">Capital Protection</h3>'+
        '<ol class="protection-list"><li>Title-verified at Land Registry</li><li>Written JV agreement</li><li>Full Deal Analyzer transparency</li><li>Start small, build trust</li></ol>'+
        (p.latitude&&p.longitude?'<div class="map-container"><div class="map-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><p style="margin-top:.75rem">'+p.latitude+', '+p.longitude+'</p></div></div>':'')+
      '</div>'+
      '<div class="sidebar-col">'+
        '<div class="sidebar-card" id="dealAnalyzer"><h2>Deal Analyzer</h2><p style="color:#A8A29E;font-size:.875rem">Loading deal data...</p></div>'+
        '<div class="sidebar-card">'+
          '<h2>Invest in This Property</h2>'+
          interestCTA+
          '<div class="contact-info">Questions? <a href="mailto:evarestuschinecherem@gmail.com">evarestuschinecherem@gmail.com</a></div>'+
        '</div>'+
      '</div></div>'+
      '<div class="related-section" id="relatedSection"></div>';

    loadDeal(p);
    loadRelated(p);
  }catch(e){document.getElementById('propertyContent').innerHTML='<p style="color:#DC2626">Error loading property.</p>';}
}

function switchMedia(idx){
  const main=document.getElementById('galleryMain');
  const item=mediaItems[idx];
  if(item.type==='video'){
    main.innerHTML='<video autoplay muted loop playsinline onclick="openLightbox('+idx+')"><source src="'+item.url+'" type="'+(item.mime||'video/mp4')+'"></video>'+(mediaItems.length>1?'<span class="gallery-count">'+mediaItems.length+' photos</span>':'');
  }else{
    main.innerHTML='<img src="'+item.url+'" alt="Property" onclick="openLightbox('+idx+')">'+(mediaItems.length>1?'<span class="gallery-count">'+mediaItems.length+' photos</span>':'');
  }
  main.onclick=function(){openLightbox(idx);};
  document.querySelectorAll('.gallery-thumb').forEach((t,i)=>t.classList.toggle('active',i===idx));
}

function toggleInterestForm(){
  document.getElementById('interestForm')?.classList.toggle('open');
}

async function submitInterest(propertyId){
  const msg=document.getElementById('interestMsg')?.value||'';
  const amount=document.getElementById('interestAmount')?.value||'';
  const token=localStorage.getItem('token');
  if(!token){window.location='/api/public/page/login';return;}
  try{
    const r=await fetch('/api/public/deals',{method:'GET'});
    const d=await r.json();
    const deal=d.items?.find(dl=>dl.property_id===propertyId);
    if(!deal){alert('No active deal for this property yet.');return;}
    const ir=await fetch('/api/public/deals/'+deal.id+'/interest',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({message:msg,amount_indicative:amount})
    });
    const id=await ir.json();
    if(id.ok){
      document.getElementById('interestForm').innerHTML='<p style="color:#16A34A;font-weight:600;padding:1rem 0">Interest submitted! We will be in touch.</p>';
    }else{
      alert(id.error==='already_expressed'?'You have already expressed interest in this deal.':'Error: '+(id.error||'unknown'));
    }
  }catch{alert('Error submitting interest. Please try again.');}
}

async function loadDeal(p){
  try{
    const r=await fetch('/api/public/deals');
    const d=await r.json();
    const deal=d.items?.find(dl=>dl.property_id===p.id);
    if(!deal){document.getElementById('dealAnalyzer').innerHTML='<h2>Deal Analyzer</h2><p style="color:#A8A29E;font-size:.875rem">Deal analyzer not yet available for this property.</p>';return;}
    document.getElementById('dealAnalyzer').innerHTML='<h2>Deal Analyzer</h2>'+
      '<div class="deal-row"><span>Purchase Price</span><span>'+formatNgn(deal.purchase_price_ngn)+'</span></div>'+
      '<div class="deal-row"><span>Renovation & Costs</span><span>'+formatNgn(deal.renovation_costs_ngn+(deal.legal_fees_ngn||0))+'</span></div>'+
      '<div class="deal-row highlight"><span><strong>Total Investment</strong></span><span><strong>'+formatNgn(deal.total_investment_ngn)+'</strong></span></div>'+
      '<div class="deal-row"><span>Projected Resale</span><span>'+formatNgn(deal.projected_resale_ngn)+'</span></div>'+
      '<div class="deal-row profit"><span>Gross Profit</span><span>'+formatNgn(deal.gross_profit_ngn)+' ('+(deal.return_percentage||0)+'%)</span></div>'+
      '<div class="deal-row"><span>Investor Share</span><span>'+(deal.investor_share_min||60)+'–'+(deal.investor_share_max||80)+'%</span></div>'+
      '<div class="deal-row"><span>Deal Cycle</span><span>'+(deal.deal_cycle_months||3)+' months</span></div>';
  }catch{}
}

async function loadRelated(currentProp){
  try{
    const r=await fetch('/api/public/properties?limit=50&status=available');
    const d=await r.json();
    if(!d.ok||!d.items)return;
    const related=d.items.filter(p=>p.slug!==currentProp.slug).slice(0,3);
    if(related.length===0)return;
    document.getElementById('relatedSection').innerHTML=
      '<h2>Similar Properties</h2>'+
      '<div class="related-grid">'+related.map(p=>{
        const img=p.hero_image?'<img src="'+p.hero_image+'" alt="'+p.title+'" loading="lazy">':'';
        return '<div class="related-card" onclick="window.location=\'/api/public/page/property/'+p.slug+'\'">'+
          '<div class="rc-img">'+img+'</div>'+
          '<div class="rc-body">'+
            '<div class="rc-title">'+p.title+'</div>'+
            '<div class="rc-loc">'+p.city+', '+p.state+'</div>'+
            '<div class="rc-price">'+formatNgn(p.price_ngn)+'</div>'+
          '</div>'+
        '</div>';
      }).join('')+'</div>';
  }catch{}
}

loadProperty();
</script>
